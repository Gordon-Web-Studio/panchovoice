[project]
name = "acme-agent"
version = "0.1.0"
description = "ACME Appointments: a small demo voice agent for PanchoVoiceAI (pv-ws/1 WebSocket server)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=13",
    "numpy>=1.26",
    "httpx>=0.27",
    "faster-whisper>=1.1",
    "anthropic>=2.13.0",
]

[project.scripts]
acme-agent = "acme_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
