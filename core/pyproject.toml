[project]
name = "panchovoice"
version = "0.1.0"
description = "PanchoVoiceAI: test voice AI agents with a real audio caller, two channel recordings and scores."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "websockets>=13.0",
    "httpx>=0.27",
    "faster-whisper>=1.1.0",
    "jiwer>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "questionary>=2.1.1",
    "mcp>=2.3.0",
    "miniaudio>=1.61",
]

[project.scripts]
panchovoice = "panchovoice.cli:app"
pv = "panchovoice.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panchovoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: needs local services (Kokoro, claude CLI, models); skipped unless PV_LIVE=1",
]
